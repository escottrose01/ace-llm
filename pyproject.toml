[project]
name = "ace-llm"
version = "0.1.0"
description = "ACE: the Abstract-Concrete-Execute security architecture for LLM-integrated app systems."
readme = "README.md"
requires-python = ">=3.10.16"
dependencies = [
    "pygments>=2.19.1",
    "langchain>=0.3.25",
    "langchain_community>=0.3.25",
    "langchain_openai>=0.3.22",
    "langchain_anthropic>=0.3.15",
    "faiss-cpu>=1.11.0",
    "transformers>=4.52.4",
    "tensorflow>=2.19.0",
    "docker>=7.1.0",
    "astor>=0.8.1",
    "pydantic>=2.11.5",
    "rich>=13.9.0",
    "click>=8.2.1",
]

[project.scripts]
ace = "ace.main:cli"

[dependency-groups]
bench-asb = [
    "pandas>=2.3.1",
]
bench-injec = [
    "pandas>=2.3.1",
    "polyfactory>=2.22.2",
]
bench-langchain = [
    "flask>=3.1.2",
    "langchain-benchmarks>=0.0.10",
]
dev = [
    "ruff>=0.4.4",
    "pyright>=1.1.365",
    "pytest>=8.4.0",
    "pytest-cov>=4.1.0",
    "python-dotenv>=1.0.1",
    "types-pyyaml>=6.0.12.20240311",
    "jupyterlab>=4.1.2",
    "tiktoken>=0.7.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0"
]
docs = [
    "mkdocs-material>=9.5.26",
    "mkdocstrings[python]>=0.25.1"
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 120
exclude = ["tools", "injec_eval"]

[tool.ruff.lint]
ignore = [
    "N802",  # Function name should be lowercase (AST visitor methods must be visit_*)
    "N805",  # First argument of a method should be named `self` (Pydantic validators use `cls`)
    "UP007", # Use X | Y for type annotations (complex types don't work well with this)
]
select = [
    "F",   # pyflakes
    "UP",  # pyupgrade
    "I",   # isort
    "ERA", # eradicate
    "NPY", # numpy
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "RUF",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pyright]
include = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
 
